{% extends "base.html" %}

{% block title %}Admin Login — {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-icon">🔐</div>
        <h1 class="auth-title">Admin Login</h1>
        <p class="auth-sub">Access the {{ app_name }} admin panel.</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/admin/login" method="POST" class="auth-form">
            <input type="password" name="password" placeholder="Admin password" required class="auth-input" autofocus>
            <button type="submit" class="search-btn" style="width: 100%;">Sign In</button>
        </form>
        <a href="/" class="auth-back">← Back to home</a>
    </div>
</div>
{% endblock %}
